{{- if not .Values.secret.existingSecret }}
{{- $apiKey := required "Set secret.existingSecret (a Secret with the key api-key) or secret.apiKey" .Values.secret.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tvdash.fullname" . }}
  labels:
    {{- include "tvdash.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $apiKey | quote }}
  {{- with .Values.secret.hassToken }}
  hass-token: {{ . | quote }}
  {{- end }}
{{- end }}
