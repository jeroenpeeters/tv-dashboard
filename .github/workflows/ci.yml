name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:        # the release workflow runs the same checks before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint charts/tvdash --strict -f charts/tvdash/ci/test-values.yaml
      - run: helm template ci charts/tvdash -f charts/tvdash/ci/test-values.yaml > /dev/null
      - name: The chart refuses to render without the required settings
        run: |
          for args in "--set tvs=null" "--set secret.apiKey=" "--set image.repository=ghcr.io/OWNER/tvdash"; do
            if helm template ci charts/tvdash -f charts/tvdash/ci/test-values.yaml $args > /dev/null 2>&1; then
              echo "expected a failure for: $args"; exit 1
            fi
          done

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: tvdash:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test, with the restrictions the chart applies
        run: |
          docker run -d --name tvdash --read-only --tmpfs /tmp:uid=1000,gid=1000 --cap-drop ALL \
            --security-opt no-new-privileges --user 1000:1000 -p 8080:8080 \
            -v "$PWD/config.example.json:/config/tvdash.json:ro" \
            -e API_KEY=ci-only -e TVS=tv=192.0.2.1 -e TVDASH_CONFIG=/config/tvdash.json tvdash:ci
          for i in $(seq 30); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/status)" = 401
          docker exec tvdash python -c "import tvdash, pathlib; tvdash.render(tvdash.DASHBOARD.as_uri(), pathlib.Path('/tmp/t.png'))"
          docker logs tvdash

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
