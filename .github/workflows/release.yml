name: Release

# Push a tag like v1.2.3 to publish
#   ghcr.io/<owner>/tvdash:1.2.3                     the container image
#   oci://ghcr.io/<owner>/charts/tvdash  1.2.3       the Helm chart (appVersion 1.2.3, so it deploys the image above)
# Both are signed keyless with cosign. Nothing is published unless the CI checks pass.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64     # add linux/arm64 for ARM nodes (the build then runs under QEMU and takes a lot longer)
  HELM_VERSION: v4.3.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "not a semver tag: $TAG"; exit 1; }
          # Releases come from main only.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:            # a called workflow can never get more than its caller grants
      contents: read
      pull-requests: read

  image:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/tvdash
          flavor: latest=false      # deployments pin a version; there is no moving "latest"
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/tvdash
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    needs: [prepare, image]     # the chart is only published when the image it points to exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ needs.prepare.outputs.owner }}
        run: |
          # Point the chart at the image published by this same release.
          sed -i "s#ghcr.io/OWNER/tvdash#ghcr.io/${OWNER}/tvdash#" charts/tvdash/values.yaml
          grep -q "repository: ghcr.io/${OWNER}/tvdash" charts/tvdash/values.yaml
          helm lint charts/tvdash --strict -f charts/tvdash/ci/test-values.yaml
          helm package charts/tvdash --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push and sign
        env:
          OWNER: ${{ needs.prepare.outputs.owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          # helm keeps its credentials in its own config; cosign reads the docker one, so it needs its own login
          echo "$GH_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/tvdash-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log
          DIGEST=$(sed -n 's/^Digest: //p' push.log)
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/${OWNER}/charts/tvdash@${DIGEST}"

  github-release:
    needs: [prepare, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) flag=--prerelease ;; *) flag= ;; esac
          gh release create "$TAG" --verify-tag --generate-notes $flag
