<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tvdash companion</title>
<link rel="stylesheet" href="app.css">
<body data-state="connecting">
  <div class="glow"></div>
  <main class="stage">
    <svg class="mark" viewBox="0 0 240 240" width="300" height="300" aria-hidden="true">
      <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4cc9f0"/>
          <stop offset="1" stop-color="#7b61ff"/>
        </linearGradient>
      </defs>
      <circle class="ring" cx="120" cy="120" r="108" fill="none" stroke-width="4"/>
      <circle class="arc" cx="120" cy="120" r="108" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="170 510"/>
      <rect class="frame" x="64" y="82" width="112" height="72" rx="9" fill="none" stroke-width="5"/>
      <rect class="tile t1" x="75" y="93" width="40" height="22" rx="4" fill="url(#accent)"/>
      <rect class="tile t2" x="125" y="93" width="40" height="22" rx="4" fill="url(#accent)"/>
      <rect class="tile t3" x="75" y="123" width="90" height="20" rx="4" fill="url(#accent)"/>
      <rect class="stand" x="104" y="161" width="32" height="5" rx="2.5"/>
    </svg>
    <h1 class="word">tv<span>dash</span></h1>
    <p class="sub">COMPANION</p>
    <p class="status"><i class="dot"></i><span id="status">Verbinden…</span></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
